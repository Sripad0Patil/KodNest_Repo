<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <link rel="stylesheet" href="/css/pseudo-classesStyle.css">
</head>
<body>
    <h1>Pseudo Classes</h1>
    <input id="input1" type="text">
    <br> <br>
    <input id="input2" type="text">
    <br> <br>
    <div class="box">
        <input>
    </div>
    <br> <br>
    <a href="">Link</a>
    <br> <br>
    <input id="input3" type="checkbox">
    <br> <br>
    <input id="input4" disabled>
    <br> <br>
    <input id="input5">
    <br> <br>
    <input id="input6" required>
    <br> <br>
    <input id="input7" optional>
    <br> <br>
    <input id="input8" read-only>
    <br> <br>
    <input id="input9" read-write>
    <br> <br>
    <input id="input10" valid>
    <br> <br>
    <input id="input11" invalid>
    <br> <br>
    <input id="input12" type="number" min="1" max="10">
    <br> <br>
    <input id="input13" type="number" min="1" max="10">
    <br> <br>
    <input id="input14" placeholder-shown>
    <br> <br>
    <button>Hover Me</button>
    <br> <br>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
        <li>Grapes</li>
    </ul>
    <br> <br>
    <div>
        <p>Paragraph 1</p>
        <span>Span</span>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>
    </div>
    <br><br>
    <ul>
        <li>HTML</li>
        <li class="active">CSS</li>
        <li>JavaScript</li>
    </ul>
    <br><br>
    <div>
        <p>Only paragraph</p>
    </div>

    <div>
        <p>First</p>
        <p>Second</p>
    </div>
</body>
</html>
