<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <link rel="stylesheet" href="/css/selectorsStyle.css">
</head>
<body>
    <h1>Selectors in CSS</h1>
    <input type="text" placeholder="Leave a comment!">
    <div id="css">
        <p class="definition">Selectors in CSS are patterns used to select and style specific HTML elements.</p>
    </div>

    <div class="selectors" id="grand-parents">Grand Parents
        <div class="selectors" id="parents">
            Parents
            <div class="selectors" id="child1">Child 1</div>
            <div class="selectors" id="child2">Child 2</div>
            <div class="selectors" id="child3">Child 3</div>
            <div class="selectors" id="child4">Child 4</div>
        </div>
    </div>
</body>
</html>
