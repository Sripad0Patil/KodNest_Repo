<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>
        body {
            background-color: #212121;
            color: #fff;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        #guessField {
            padding: 8px;
            font-size: 16px;
        }

        #subt {
            padding: 8px 15px;
            cursor: pointer;
        }

        #ng {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <h1>Number Guessing Game</h1>

        <p>Try and guess a random number between 1 and 100.</p>

        <p>You have 10 attempts to guess the right number.</p>

        <br>

        <form class="form">

            <label for="guessField" id="guess">
                Guess a number:
            </label>

            <input
                type="text"
                id="guessField"
                class="guessField"
            >

            <input
                type="submit"
                id="subt"
                value="Submit Guess"
            >

        </form>

        <div class="resultParas">

            <p>
                Previous Guesses:
                <span class="guesses"></span>
            </p>

            <p>
                Guesses Remaining:
                <span class="lastResult">10</span>
            </p>

            <p class="lowOrHi"></p>

        </div>

    </div>


    <script>

        // Generate random number between 1 and 100
        let randomNum = Math.floor(Math.random() * 100) + 1;

        // Selecting HTML elements
        const submit = document.querySelector('#subt');

        const userInput = document.querySelector('#guessField');

        const guessSlot = document.querySelector('.guesses');

        const remaining = document.querySelector('.lastResult');

        const lowOrHi = document.querySelector('.lowOrHi');

        const startOver = document.querySelector('.resultParas');

        // Paragraph element for new game button
        const p = document.createElement('p');

        // Variables
        let prevGuess = [];

        let numGuess = 1;

        let playGame = true;


        // --------------------------------
        // SUBMIT GUESS
        // --------------------------------

        submit.addEventListener('click', function (e) {

            // Prevent form from refreshing the page
            e.preventDefault();

            // Don't allow guesses after game ends
            if (!playGame) {
                return;
            }

            // Convert input into number
            const guess = parseInt(userInput.value);

            console.log("User Guess:", guess);

            validateGuess(guess);

        });


        // --------------------------------
        // VALIDATE GUESS
        // --------------------------------

        function validateGuess(guess) {

            // Check if input is not a number
            if (isNaN(guess)) {

                alert('Please enter a valid number!');

            }

            // Check if number is less than 1
            else if (guess < 1) {

                alert('Guess is less than 1!');

            }

            // Check if number is greater than 100
            else if (guess > 100) {

                alert('Guess is more than 100!');

            }

            // Valid guess
            else {

                prevGuess.push(guess);

                displayGuess(guess);

                // Check whether user has used all 10 attempts
                if (numGuess > 10) {

                    displayMessage(
                        `Game Over! Random number was ${randomNum}!`
                    );

                    endGame();

                }

                else {

                    checkGuess(guess);

                }

            }

        }


        // --------------------------------
        // CHECK GUESS
        // --------------------------------

        function checkGuess(guess) {

            // Correct answer
            if (guess === randomNum) {

                displayMessage(
                    `Your Guess is Correct!`
                );

                endGame();

            }

            // Guess is too low
            else if (guess < randomNum) {

                displayMessage(
                    `Number is TOO low`
                );

            }

            // Guess is too high
            else if (guess > randomNum) {

                displayMessage(
                    `Number is TOO high`
                );

            }

        }


        // --------------------------------
        // DISPLAY MESSAGE
        // --------------------------------

        function displayMessage(message) {

            lowOrHi.innerHTML = `<h2>${message}</h2>`;

        }


        // --------------------------------
        // DISPLAY GUESS
        // --------------------------------

        function displayGuess(guess) {

            // Clear input box
            userInput.value = '';

            // Display previous guess
            guessSlot.innerHTML += `${guess}, `;

            // Increase attempt count
            numGuess++;

            // Calculate remaining guesses
            remaining.innerHTML = `${11 - numGuess}`;

        }


        // --------------------------------
        // END GAME
        // --------------------------------

        function endGame() {

            // Clear input
            userInput.value = '';

            // Disable input
            userInput.setAttribute('disabled', '');

            // Disable submit button
            submit.setAttribute('disabled', '');

            // Create new game button
            p.classList.add('button');

            p.innerHTML = `
                <h2 id="ng">Start New Game!</h2>
            `;

            // Add button to page
            startOver.appendChild(p);

            // Game is over
            playGame = false;

            // Setup new game
            newGame();

        }


        // --------------------------------
        // NEW GAME
        // --------------------------------

        function newGame() {

            const newGameButton = document.querySelector('#ng');

            newGameButton.addEventListener('click', function () {

                // Generate new random number
                randomNum = Math.floor(Math.random() * 100) + 1;

                // Reset guesses
                prevGuess = [];

                // Reset attempt counter
                numGuess = 1;

                // Clear previous guesses
                guessSlot.innerHTML = '';

                // Reset remaining guesses
                remaining.innerHTML = '10';

                // Clear message
                lowOrHi.innerHTML = '';

                // Enable input
                userInput.removeAttribute('disabled');

                // Enable submit button
                submit.removeAttribute('disabled');

                // Remove "Start New Game" button
                startOver.removeChild(p);

                // Start game again
                playGame = true;

            });

        }

    </script>

</body>

</html>
