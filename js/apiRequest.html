<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest Ready States</title>

    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #212121;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        code {
            background-color: #eee;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Value</th>
                <th>State</th>
                <th>Description</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>0</td>
                <td>UNSENT</td>
                <td>Client has been created. <code>open()</code> not called yet.</td>
            </tr>

            <tr>
                <td>1</td>
                <td>OPENED</td>
                <td><code>open()</code> has been called.</td>
            </tr>

            <tr>
                <td>2</td>
                <td>HEADERS_RECEIVED</td>
                <td><code>send()</code> has been called, and headers and status are available.</td>
            </tr>

            <tr>
                <td>3</td>
                <td>LOADING</td>
                <td>Downloading; <code>responseText</code> holds partial data.</td>
            </tr>

            <tr>
                <td>4</td>
                <td>DONE</td>
                <td>The operation is complete.</td>
            </tr>
        </tbody>
    </table>

</body>
<script>
    const requestURL = 'https://api.github.com/users/Sripad0Patil';
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestURL);
    xhr.onreadystatechange = function() {
        console.log(xhr.readyState);
        if(xhr.readyState === 4) {
            console.log(typeof data)
            const data = JSON.parse(this.responseText);
            console.log(typeof data)
            console.log(data.followers);
        }
    }
    xhr.send();
</script>
</html>
